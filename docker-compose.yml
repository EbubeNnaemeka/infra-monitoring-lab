# Zabbix 7.0 LTS stack. Credentials come from .env (copy .env.example).
services:
  zabbix-db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      # MySQL 8.x enables binary logging by default, which makes Zabbix's
      # schema import fail with ERROR 1419 when it creates triggers.
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: zabbix
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - zabbix-db-data:/var/lib/mysql
    networks: [zabbix]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-7.0-latest
    environment:
      DB_SERVER_HOST: zabbix-db
      MYSQL_DATABASE: zabbix
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:10051:10051"
    depends_on:
      zabbix-db:
        condition: service_healthy
    networks: [zabbix]
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:ubuntu-7.0-latest
    environment:
      DB_SERVER_HOST: zabbix-db
      MYSQL_DATABASE: zabbix
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${PHP_TZ:-America/Toronto}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on: [zabbix-server]
    networks: [zabbix]
    restart: unless-stopped

  # Local agent so the server has a real host to monitor before the AD lab VMs exist.
  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    hostname: lab-linux-agent
    environment:
      ZBX_HOSTNAME: lab-linux-agent
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_ACTIVE: zabbix-server
    depends_on: [zabbix-server]
    networks: [zabbix]
    restart: unless-stopped

networks:
  zabbix:

volumes:
  zabbix-db-data:
