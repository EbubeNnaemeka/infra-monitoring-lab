# Zabbix trigger definitions for the lab (importable reference, not a full
# Zabbix export XML — documents the expressions used for each trigger below).

triggers:
  - name: "DC service down"
    expression: 'last(/Windows Agent/service.state[NTDS])=0 or last(/Windows Agent/service.state[DNS])=0'
    severity: Disaster
    hosts: [DC01, DC02]

  - name: "Disk space low"
    expression: 'last(/Windows Agent/vfs.fs.size[C:,pfree])<15'
    severity: High
    hosts: [DC01, DC02, WIN11-CLIENT]

  - name: "High CPU sustained"
    expression: 'min(/Windows Agent/system.cpu.util,5m)>90'
    severity: Warning
    hosts: [DC01, DC02, WIN11-CLIENT]

  - name: "Host unreachable"
    expression: 'nodata(/Windows Agent/agent.ping,3m)=1'
    severity: High
    hosts: [DC01, DC02, WIN11-CLIENT]
